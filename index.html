
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>準備中</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: #333;
    }

    .loading-box {
      width: min(90%, 480px);
      padding: 50px 30px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 25px;
      font-size: 26px;
      letter-spacing: 0.08em;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 25px;
      border: 4px solid #e5e5e5;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #message {
      margin: 0;
      font-size: 15px;
      line-height: 1.8;
      color: #666;
    }

    .small {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="loading-box">
    <h1>接続中...</h1>

    <div class="spinner"></div>

    <p id="message">
      ページを準備しています。<br>
      この画面を閉じずに少々お待ちください。
    </p>

    <div class="small">
      準備ができ次第、自動的に移動します。<br>
      （表示まで30秒〜1分ほどかかる場合があります。）
    </div>
  </div>

  <script>
    const RENDER_URL = "https://shared-lottery.onrender.com";

    const params = new URLSearchParams(window.location.search);
    const lotteryId = params.get("id");

    let attempts = 0;

    async function checkRender() {
      attempts++;

      try {
        const response = await fetch(
          RENDER_URL + "/health?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );

        if (response.ok) {

          if (lotteryId) {
            window.location.replace(
              RENDER_URL + "/l/" + encodeURIComponent(lotteryId)
            );
          } else {
            window.location.replace(RENDER_URL + "/");
          }

          return;
        }

      } catch (error) {
        // Renderが起動途中の場合は、しばらく待って再確認します。
      }

      if (attempts >= 40) {
        document.getElementById("message").innerHTML =
          "起動に時間がかかっています。<br>" +
          "もう少しこのままお待ちください。";
      }

      setTimeout(checkRender, 3000);
    }

    checkRender();
  </script>

</body>
</html>
